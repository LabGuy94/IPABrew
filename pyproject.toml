[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipabrew"
version = "0.1.0"
description = "Proto-language reconstruction web app and local CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "flask-cors>=5.0,<6.0",
    "gunicorn>=23.0,<24.0",
    "lingpy>=2.6,<3.0",
    "lingrex>=1.4,<2.0",
    "panphon>=0.22,<1.0",
    "pandas>=2.0,<4.0",
    "pyyaml>=6.0",
    "torch>=2.0",
    "pytorch-lightning>=2.0,<3.0",
    "einops",
    "tabulate",
    "torchmetrics>=0.11,<1.0",
    "scikit-learn",
    "scipy",
    "regex",
    "transformers",
    "torchshow",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ipabrew = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = [
    "data/*.tsv",
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/*.png",
]
